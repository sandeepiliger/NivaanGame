name: Android Build

# The android/ project isn't committed (it's fully regenerated from
# capacitor.config.json + the installed plugins — see DEPLOYMENT.md), and
# building it needs the real Android SDK/Google Maven, which isn't reachable
# from every environment. GitHub's own runners have full internet access,
# so this workflow is the actual build verification for the native app.
#
# The Android SDK is set up with plain shell commands rather than a
# marketplace action, so this doesn't depend on any third-party action
# being allowed. Presence checks for optional secrets are routed through
# job-level env vars (see HAS_GOOGLE_SERVICES / HAS_SIGNING_KEY below)
# rather than referenced directly in `if:` — GitHub Actions doesn't expose
# the `secrets` context there, and doing so anyway fails the whole run
# with zero jobs and no logs, which is a nasty one to debug blind.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'styles/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'tools/build-www.mjs'
      - 'tools/android-patch.mjs'
      - 'tools/android-signing.mjs'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: /opt/android-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    # `if:` conditions can't reference `secrets` directly (GitHub Actions
    # doesn't expose that context there — it only errors at run time, with
    # zero jobs and no logs, which is exactly what made this hard to
    # diagnose). Routing the presence checks through job-level env vars
    # first works around it.
    env:
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Stage web assets
        run: npm run build:www

      - name: Add Android platform
        run: npx cap add android

      - name: Patch AdMob manifest entry
        run: node tools/android-patch.mjs

      # Only present once you've created a Firebase project and added this
      # secret (see DEPLOYMENT.md) — analytics silently no-ops without it,
      # so the build succeeds either way.
      - name: Write Firebase config
        if: ${{ env.HAS_GOOGLE_SERVICES == 'true' }}
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Debug build (always — proves the native wiring compiles)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: nivaan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Only runs once you've created a signing keystore and added the four
      # ANDROID_* secrets below (see DEPLOYMENT.md) — until then, the debug
      # APK above is the build verification, and there's nothing to sign yet.
      - name: Decode signing keystore
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Add release signing config
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
        run: node tools/android-signing.mjs

      - name: Release build (signed AAB, for Play Store upload)
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        with:
          name: nivaan-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
