name: Android Build

# The android/ project isn't committed (it's fully regenerated from
# capacitor.config.json + the installed plugins — see DEPLOYMENT.md), and
# building it needs the real Android SDK/Google Maven, which isn't reachable
# from every environment. GitHub's own runners have full internet access,
# so this workflow is the actual build verification for the native app.
#
# The Android SDK is set up with plain shell commands rather than a
# marketplace action, so this doesn't depend on any third-party action
# being allowed. Presence checks for optional secrets are routed through
# job-level env vars (see HAS_GOOGLE_SERVICES / HAS_SIGNING_KEY below)
# rather than referenced directly in `if:` — GitHub Actions doesn't expose
# the `secrets` context there, and doing so anyway fails the whole run
# with zero jobs and no logs, which is a nasty one to debug blind.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'styles/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'tools/build-www.mjs'
      - 'tools/android-patch.mjs'
      - 'tools/android-signing.mjs'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # `if:` conditions can't reference `secrets` directly (GitHub Actions
    # doesn't expose that context there — it only errors at run time, with
    # zero jobs and no logs, which is exactly what made this hard to
    # diagnose). Routing the presence checks through job-level env vars
    # first works around it.
    env:
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Compiles the Java that android-patch.mjs generates against stubs, in
      # about a second. The Gradle build below would catch the same errors,
      # but ninety seconds later and after everything else has already run.
      - name: Check generated Android Java compiles
        run: node tools/check-android-java.mjs

      # ubuntu-latest ships an Android SDK already, with its own ANDROID_HOME
      # pre-set on the runner — installing a second one and setting our own
      # ANDROID_SDK_ROOT alongside it makes Gradle refuse to build ("Several
      # environment variables ... contain different paths to the SDK").
      # Just top up the one that's already there with whatever this app's
      # compileSdk/build-tools version needs.
      - name: Ensure required Android SDK components
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0"

      - name: Stage web assets
        run: npm run build:www

      - name: Add Android platform
        run: npx cap add android

      # `cap add android` writes Capacitor's own stock logo into the launcher
      # mipmaps and splash drawables. This regenerates both from the app's real
      # mascot — it has to run on every build, since android/ is rebuilt from
      # scratch each time and nothing in it is committed.
      - name: Generate launcher icons and splash screens
        run: npm run android:assets

      - name: Patch AdMob manifest entry
        run: node tools/android-patch.mjs

      # Only present once you've created a Firebase project and added this
      # secret (see DEPLOYMENT.md) — analytics silently no-ops without it,
      # so the build succeeds either way.
      - name: Write Firebase config
        if: ${{ env.HAS_GOOGLE_SERVICES == 'true' }}
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Debug build (always — proves the native wiring compiles)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: brainysparks-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # --- Release build ----------------------------------------------------
      #
      # Two paths, chosen by whether the four ANDROID_* secrets exist.
      #
      # With them, this signs with the real upload key and produces both the
      # AAB Play wants and a sideloadable APK.
      #
      # Without them, it still produces a genuine release APK — signed with a
      # throwaway key generated inside this job and discarded when the runner
      # is torn down. That APK is for installing and testing only: every build
      # mints a different key, so Play would reject the second upload as a
      # signature mismatch. The key is generated here rather than committed
      # because this repository is public, and a signing key in a public repo
      # would let anyone sign an APK that Android accepts as an update to
      # this app.
      - name: Decode signing keystore
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Generate a throwaway signing key (no upload key configured)
        if: ${{ env.HAS_SIGNING_KEY != 'true' }}
        run: |
          set -e
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias ephemeral -keyalg RSA -keysize 2048 -validity 30 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=BrainySparks Test Build, C=IN"
          # Exported for the Gradle step below, which reads these at build
          # time via System.getenv (see tools/android-signing.mjs).
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
            echo "ANDROID_KEY_PASSWORD=$PASS"
            echo "ANDROID_KEY_ALIAS=ephemeral"
          } >> "$GITHUB_ENV"

      - name: Add release signing config
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
        run: node tools/android-signing.mjs

      - name: Release build (your upload key — AAB for Play, plus an APK)
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      # ANDROID_KEYSTORE_PASSWORD / _KEY_ALIAS / _KEY_PASSWORD already come
      # from the job environment, exported by the step that generated the key.
      - name: Release build (throwaway key — install and test only)
        if: ${{ env.HAS_SIGNING_KEY != 'true' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
        run: ./gradlew assembleRelease

      # Always produced, under whichever key applied above.
      - uses: actions/upload-artifact@v4
        with:
          name: brainysparks-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        with:
          name: brainysparks-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      # The keystore must never leave the runner — neither as an artifact nor
      # in the workspace a later step might archive.
      - name: Shred the throwaway keystore
        if: ${{ always() && env.HAS_SIGNING_KEY != 'true' }}
        run: shred -u android/app/release.keystore 2>/dev/null || rm -f android/app/release.keystore
